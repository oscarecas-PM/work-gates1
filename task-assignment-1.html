<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline';">
<title>Task Assignment Builder</title>
<style>
:root{
  --blue:#2563eb; --blue-d:#1d4ed8; --green:#15803d; --slate:#475569; --slate-d:#334155;
  --bg:#f1f5f9; --card:#ffffff; --line:#cbd5e1; --ink:#0f172a; --muted:#64748b;
  --amber:#b45309; --amber-bg:#fef3c7; --amber-line:#f59e0b;
}
*{box-sizing:border-box}
body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink);font-size:14px}
h1{font-size:20px;margin:0;padding:14px 18px;background:var(--slate-d);color:#fff}
h1 span{font-size:12px;opacity:.7;font-weight:normal;margin-left:6px}
h2{font-size:15px;margin:0 0 8px}
.banner{background:#fee2e2;color:#7f1d1d;font-size:12px;padding:6px 18px;border-bottom:1px solid #fecaca}
.wrap{padding:14px 18px}
.input-section{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px}
.file-group{display:flex;flex-direction:column;gap:4px}
.file-group label{font-size:12px;font-weight:600;color:var(--slate)}
.status{font-size:11px;color:var(--muted);min-height:14px}
.status.loaded{color:var(--green)}
.status.error{color:#b91c1c;font-weight:600}
.action-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}
.btn:hover{background:#f8fafc}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-d)}
.btn-green{background:var(--green);border-color:var(--green);color:#fff}
.btn-green:hover{filter:brightness(.95)}
.btn-slate{background:var(--slate);border-color:var(--slate);color:#fff}
.btn-view{background:#0e7490;border-color:#0e7490;color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.filter-input{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;font-family:inherit;min-width:280px;flex:1;max-width:420px}
.filter-input:focus{border-color:var(--blue);outline:none}
.snapshot-notice{background:#ecfeff;border:1px solid #a5f3fc;color:#155e75;padding:6px 10px;border-radius:6px;font-size:12px;margin-bottom:10px}

#board{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
#org-pane{flex:1;min-width:420px}
#pool-pane{width:340px;min-width:300px}

.loc{background:#e2e8f0;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:14px}
.loc-head,.team-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.caret{cursor:pointer;user-select:none;color:var(--slate);font-size:13px;width:14px;text-align:center;display:inline-block;flex:0 0 auto}
.caret:hover{color:var(--blue)}
.count-badge{font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;background:#e2e8f0;color:var(--slate-d)}
.loc-name{font-size:16px;font-weight:700}
.team{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin:10px 0 0}
.team-name{font-size:14px;font-weight:700;color:var(--slate-d)}
.team-zone{margin-top:8px}
.team-goal{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 2px}
.team-goal .lab{font-size:12px;font-weight:700;color:var(--slate)}
.goal-input{font-family:inherit;flex:1;min-width:200px;border:1px solid var(--line);background:#fff;border-radius:5px;padding:3px 8px;font-size:13px}
.goal-input:focus{border-color:var(--blue);outline:none}
.goal-date{font-size:11px;color:var(--muted)}
.goal-date.stale{color:#b45309;font-weight:700}
.team-goal .goal-date.stale{background:#fef3c7;border:1px solid #fde047;border-radius:8px;padding:1px 7px}
.name-input{font-family:inherit;border:1px solid transparent;background:transparent;border-radius:5px;padding:3px 6px;min-width:160px}
.name-input:hover{border-color:var(--line);background:#fff}
.name-input:focus{border-color:var(--blue);background:#fff;outline:none}
.spacer{flex:1}
.mini{border:1px solid var(--line);background:#fff;border-radius:5px;padding:2px 7px;font-size:12px;cursor:pointer;line-height:1.3}
.mini:hover{background:#f1f5f9}
.mini.danger:hover{background:#fee2e2;border-color:#fca5a5}
.members{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.mtag{display:inline-flex;align-items:center;gap:4px;background:#e2e8f0;border:1px solid var(--line);border-radius:12px;padding:2px 8px;font-size:12px}
.mtag .x{cursor:pointer;color:var(--muted);font-weight:700}
.mtag .x:hover{color:#b91c1c}
.addmem{display:flex;gap:6px;margin:6px 0}
.addmem input{border:1px solid var(--line);border-radius:5px;padding:4px 7px;font-size:12px;flex:1;min-width:120px}
.empty-hint{color:var(--muted);font-style:italic;font-size:12px;padding:6px 0}
#pool-zone{min-height:80px}

.wo-card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:6px;padding:8px 10px;margin:6px 0}
.wo-card.stale{border-left-color:var(--amber-line);background:var(--amber-bg)}
.wo-head{font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wo-head.clickable{cursor:pointer;border-radius:4px}
.wo-head.clickable:hover{color:var(--blue-d)}
.assign-hint{font-size:10px;color:var(--blue);font-weight:700;letter-spacing:.02em}
.wo-remove{margin:4px 0}
.wo-sub{color:var(--slate-d);margin:2px 0}
.wo-sub .pn{color:var(--muted);font-size:12px}
.wo-meta{font-size:12px;color:var(--slate);margin-top:2px}
.linkbtn{cursor:pointer;color:var(--blue);font-weight:600;text-decoration:underline;font-size:12px}
.ontime{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:10px;border:1px solid transparent}
.ontime.ok{background:#dcfce7;color:#166534;border-color:#86efac}
.ontime.warn{background:#fef9c3;color:#854d0e;border-color:#fde047}
.ontime.bad{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
.ontime.na{background:#e2e8f0;color:#475569;border-color:#cbd5e1}
.lastknown{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:10px;background:#fef3c7;color:#92400e;border:1px solid #fde047}
.badge{font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;text-transform:uppercase;letter-spacing:.03em}
.badge.stale{background:var(--amber-line);color:#fff}
.badge.dr{background:var(--amber);color:#fff}
.badge.pct{background:#e0f2fe;color:#075985}
.badge.team{background:#dcfce7;color:#166534}
.tagrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line)}
.tagrow .lab{font-size:11px;color:var(--muted);align-self:center}
.mchip{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--slate)}
.mchip.tagged{background:var(--blue);border-color:var(--blue);color:#fff}

.op-table{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px}
.op-table th{text-align:left;background:#f1f5f9;border:1px solid var(--line);padding:3px 6px;font-size:11px;color:var(--slate-d)}
.op-table td{border:1px solid var(--line);padding:3px 6px}
.op-table td.num{text-align:right;font-variant-numeric:tabular-nums}
.op-table td.sel,.op-table th.sel{text-align:center;white-space:nowrap}
.op-caption{font-size:11px;color:var(--muted);font-style:italic;margin:6px 0 2px}
.op-table tr.dr td{background:var(--amber-bg)}
.op-table tr.op-sel td{background:#eff6ff}
.op-table tr.op-sel.dr td{background:#fde9c8}
.op-table tr.op-claimed td{opacity:.55}
.op-table tr.op-pending td{background:#f8fafc;color:var(--slate)}
.op-table tr.op-pending.op-sel td{background:#eef4ff}
.op-table td.op-none-cell{color:var(--muted);font-style:italic;text-align:center}
.op-table tr.pend-toggle td{background:#fff;border-color:var(--line);padding:4px 6px}
.badge.pend{background:#e2e8f0;color:#475569;font-weight:600}
.claim-note{font-size:10px;color:var(--amber);font-weight:600}
.op-none{font-size:12px;color:var(--muted);font-style:italic;margin-top:6px}

/* team-picker modal */
.picker-overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding-top:8vh}
.picker{background:#fff;border-radius:10px;box-shadow:0 12px 44px rgba(0,0,0,.28);width:440px;max-width:92vw;max-height:80vh;overflow:auto;padding:16px 18px}
.picker h3{margin:0 0 3px;font-size:15px}
.picker .sub{color:var(--muted);font-size:12px;margin-bottom:10px}
.picker .loc-group{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:12px 0 4px}
.picker .team-row{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;margin:4px 0;cursor:pointer}
.picker .team-row:hover{background:#f8fafc}
.picker .team-row.on{border-color:var(--blue);background:#eff6ff}
.picker .team-row .chk{width:16px;text-align:center;font-weight:800;color:var(--blue)}
.picker .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}

@media print{
  .no-print{display:none!important}
  body{background:#fff}
  h1{background:#fff;color:#000;border-bottom:2px solid #000}
  #board{display:block}
  #pool-pane,#org-pane{width:auto}
  #pool-pane{display:none!important}
  .picker-overlay{display:none!important}
  .wo-card,.team,.loc{break-inside:avoid}
  .name-input{border:none;background:transparent;padding-left:0}
  tr.op-unsel{display:none!important}
  .print-hide{display:none!important}
}
</style>
</head>
<body>
<h1>Task Assignment Builder <span id="ver">v3.2</span></h1>
<div class="banner">PROPRIETARY — all processing is client-side. No data leaves this browser; nothing is stored or transmitted.</div>

<div class="wrap">
  <div id="snapshot-notice" class="snapshot-notice" style="display:none">Loaded from a saved plan. Continue editing; re-upload a WO Assignment Feed to refresh live status, or export.</div>

  <div class="input-section no-print">
    <div class="file-group">
      <label>WO Assignment Feed (from PDVF)</label>
      <input type="file" id="feed-file" accept=".csv,.txt" onchange="onFeedFile(this)">
      <div class="status" id="feed-status"></div>
    </div>
    <div class="file-group">
      <label>Import Saved Plan (CSV)</label>
      <input type="file" id="state-file" accept=".csv,.txt" onchange="onStateFile(this)">
      <div class="status" id="state-status"></div>
    </div>
  </div>

  <div class="action-bar no-print">
    <button class="btn btn-primary" onclick="addLocation()">+ Add Location</button>
    <button class="btn btn-view" id="view-btn" onclick="toggleView()">View: Gate names</button>
    <button class="btn btn-green" id="export-state-btn" onclick="exportStateCSV()" disabled>Export Plan CSV</button>
    <button class="btn btn-slate" id="save-btn" onclick="saveSnapshot()" disabled>Save for Editing</button>
    <button class="btn btn-green" onclick="exportTeamPDF()">Export Team PDFs</button>
    <button class="btn btn-green" onclick="exportTeamPNGs()">Export Team PNGs</button>
    <button class="btn" style="background:#fef3c7;border:1px dashed #d97706;color:#92400e" onclick="previewArtifactHTML()">Temp: Preview artifact (HTML)</button>
    <button class="btn" onclick="expandAll()">Expand all</button>
    <button class="btn" onclick="collapseAll()">Collapse all</button>
    <input type="text" id="wo-filter" class="filter-input" oninput="setFilter(this.value)" placeholder="Filter unassigned by WO #, part name, or part #">
  </div>

  <div id="board"></div>
</div>

<!-- team-picker modal (contents rendered on open); click the backdrop to cancel -->
<div id="picker-overlay" class="picker-overlay no-print" style="display:none" onclick="onPickerOverlayClick(event)">
  <div class="picker" onclick="event.stopPropagation()"><div id="picker-body"></div></div>
</div>

<!-- empty datalist now; a future Score Card roster CSV can populate it to validate / autocomplete member names -->
<datalist id="member-roster"></datalist>

<script>
// ============================== State ==============================
var locations = {};   // locId  -> { id, name, order }
var locOrder  = [];   // locId display order
var teams     = {};   // teamId -> { id, locId, name, order, goal, goalDate }  (goal = weekly team goal;
                      //   goalDate = date it was set, so a stale weekly goal is visible not perpetuated)
var members   = {};   // memberId -> { id, teamId, name, badge, order }
var wos       = {};   // woNo -> { woNo, partNo, partName, program, currentGate, opsRemInGate,
                      //   hrsRemInGate, hrsInGate, etc, percentComplete, plannedFinish, activeDrOps,
                      //   asOf, serial, avgWeeklyHours, requiredWeeklyHours, gatesRemaining, stale }
                      //   (operations live in feedOps, NOT here)
var woOrder   = [];   // woNo display/insertion order
// Operations are feed-sourced and independent of the plan: importing a saved plan must NOT erase
// them. feedOps is written ONLY by ingestFeed and is NOT reset by importState; it rides in snapshots.
var feedOps   = {};   // woNo -> [ {operNo,name,gate,plannedHrs,status,isDr} ]  (active + in-queue)
// A work order may be assigned to MANY teams. Each (WO,team) assignment carries its own
// selected operations (what prints for the week) and tagged members. Operations are exclusive
// across teams for a given WO.
var assign    = {};   // key `teamId|woNo` -> { teamId, woNo, selectedOps:[operNo], taggedMembers:[memberId] }
var nextLocId = 0, nextTeamId = 0, nextMemberId = 0;
var viewMode  = 'gate';   // 'gate' | 'operation'
var filterText = '';      // transient: filters the Unassigned pool only (not persisted)
var pickerWo  = null;     // woNo whose team-picker modal is open
// Collapse/expand is a transient navigation aid — NOT saved to CSV or snapshot.
// Default on every load: locations expanded, teams collapsed.
var collapsedLoc  = {};   // locId -> true when collapsed (default expanded)
var collapsedTeam = {};   // teamId -> false when expanded (default/undefined => collapsed)
var poolExpanded  = {};   // transient: woNo -> true when an UNASSIGNED pool card's ops are expanded
                          //   (decoupled from the global view toggle; not persisted)
var pendingExpanded = {}; // transient: woNo -> true when a WO's non-active (pending) ops are revealed
                          //   (authors must intentionally reveal future work; not persisted)
var forceExpand   = false;// reserved: force-expand all groups during a render (currently unused)
var isSnapshot = false;
// The feed OWNS every live MES field below; the plan CSV only carries them as a last-known fallback.
// `lastFeed` retains the most recent feed's live values so it can be re-applied after ANY plan import
// (feed-always-wins, independent of upload order). Per-WO `fromFeed` marks whether a WO's live data is
// from the current feed (true) or only last-known from a plan (false -> shows the "last known" badge).
var LIVE=['partNo','partName','program','currentGate','opsRemInGate','hrsRemInGate','hrsInGate',
          'etc','percentComplete','plannedFinish','activeDrOps','asOf',
          'serial','avgWeeklyHours','requiredWeeklyHours','gatesRemaining'];
var lastFeed = null;   // woNo -> { LIVE field values } from the newest feed load

// ============================== Utilities (from PDVF / decoder-ring) ==============================
var CSV_MAX_FIELD_LEN = 500;
function csvField(s){ var v = String(s == null ? '' : s).trim(); return v.length > CSV_MAX_FIELD_LEN ? v.substring(0, CSV_MAX_FIELD_LEN) : v; }
function csvQuote(s){ s = String(s == null ? '' : s); return (s.indexOf(',')>=0||s.indexOf('"')>=0||s.indexOf('\n')>=0) ? '"' + s.replace(/"/g,'""') + '"' : s; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function pad(n){ return String(n).padStart(2,'0'); }
function dateStr(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function isDrOp(op){ var n=parseInt(op,10); return n>=7000 && n<=7999; }

function parseCSV(text){
  var firstLine = text.split(/\r?\n/)[0] || '';
  var tabCount = (firstLine.match(/\t/g)||[]).length, commaCount = (firstLine.match(/,/g)||[]).length;
  var delim = (tabCount > commaCount) ? '\t' : ',';
  var result=[], current='', inQuotes=false, row=[];
  for (var i=0;i<text.length;i++){
    var ch=text[i];
    if (inQuotes){
      if (ch==='"' && text[i+1]==='"'){ current+='"'; i++; }
      else if (ch==='"'){ inQuotes=false; }
      else { current+=ch; }
    } else {
      if (ch==='"'){ inQuotes=true; }
      else if (ch===delim){ row.push(csvField(current)); current=''; }
      else if (ch==='\n'){ row.push(csvField(current)); result.push(row); row=[]; current=''; }
      else if (ch==='\r'){ /* skip */ }
      else { current+=ch; }
    }
  }
  if (current!=='' || row.length){ row.push(csvField(current)); result.push(row); }
  return result;
}
function colIndex(headers, name){
  function norm(s){ return String(s||'').replace(/^﻿/,'').replace(/\s+/g,' ').toLowerCase().trim(); }
  var n = norm(name);
  for (var i=0;i<headers.length;i++) if (norm(headers[i])===n) return i;
  return -1;
}
function toISODate(s){
  s = String(s==null?'':s).trim(); if (!s) return ''; var m;
  if ((m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s))){}
  else if ((m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s))){ m=[m[0],m[3],m[1],m[2]]; }
  else if ((m=/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/.exec(s))){}
  else return null;
  var y=+m[1],mo=+m[2],d=+m[3]; if (mo<1||mo>12||d<1||d>31) return null;
  return y+'-'+pad(mo)+'-'+pad(d);
}
function downloadFile(content, filename, type){
  var blob=new Blob([content],{type:type}), url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}
function showStatus(id,msg,cls){ var el=document.getElementById(id); if(!el) return; el.textContent=msg; el.className='status '+(cls||'loaded'); }
function loadCSV(file, cb, statusId){
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{ var rows=parseCSV(ev.target.result); if(rows.length<2) throw new Error('File has no data rows'); cb(rows); }
    catch(err){ showStatus(statusId,'Error: '+err.message,'error'); }
  };
  reader.readAsText(file);
}
function get(row,i){ return i>=0 ? (row[i]||'').trim() : ''; }
function fmtNum(v){ if(v===''||v==null) return '—'; var n=parseFloat(v); return isNaN(n)?esc(String(v)):(Math.round(n*10)/10).toString(); }
function fmtPct(v){ if(v===''||v==null) return '—'; var n=parseFloat(v); return isNaN(n)?esc(String(v)):(Math.round(n)+'%'); }

// ============================== Collection helpers ==============================
function teamsOf(locId){ return Object.keys(teams).map(function(k){return teams[k];}).filter(function(t){return t.locId===locId;}).sort(function(a,b){return a.order-b.order;}); }
function membersOf(teamId){ return Object.keys(members).map(function(k){return members[k];}).filter(function(m){return m.teamId===teamId;}).sort(function(a,b){return a.order-b.order;}); }
function teamName(id){ return teams[id]?teams[id].name:id; }
function assignKey(woNo,teamId){ return teamId+'|'+woNo; }
function getAssign(woNo,teamId){ return assign[assignKey(woNo,teamId)]||null; }
function assignmentsOfTeam(teamId){ return woOrder.map(function(wo){ return getAssign(wo,teamId); }).filter(Boolean); }
function teamsOfWo(woNo){ var out=[]; Object.keys(assign).forEach(function(k){ if(assign[k].woNo===woNo) out.push(assign[k].teamId); }); return out; }
function isUnassigned(woNo){ return teamsOfWo(woNo).length===0; }
function unassignedWos(){ return woOrder.map(function(w){return wos[w];}).filter(function(w){return w && isUnassigned(w.woNo);}); }
// teamId that has selected this op for this WO, other than `exceptTeam` (op exclusivity)
function claimedByOther(woNo, operNo, exceptTeam){
  var found=null, op=String(operNo);
  Object.keys(assign).forEach(function(k){ var a=assign[k];
    if(a.woNo===woNo && a.teamId!==exceptTeam && (a.selectedOps||[]).indexOf(op)>=0) found=a.teamId; });
  return found;
}

// ============================== Hierarchy CRUD ==============================
// Names are edited inline (no prompt) and deletes use a two-click inline confirm (no confirm()),
// so the tool works in sandboxed preview iframes where window.prompt/confirm are unavailable.
var pendingDel=null;   // token ('L<id>' / 'T<id>') currently awaiting a Confirm-delete click
function armDel(t){ pendingDel=t; render(); }
function cancelDel(){ pendingDel=null; render(); }
function delControl(token, fnCall){
  if(pendingDel===token) return '<button class="mini danger no-print" onclick="'+fnCall+'">Confirm delete</button> <button class="mini no-print" onclick="cancelDel()">Cancel</button>';
  return '<button class="mini danger no-print" onclick="armDel(\''+token+'\')">Delete</button>';
}
function focusEl(id){ setTimeout(function(){ var e=document.getElementById(id); if(e){ e.focus(); if(e.select) e.select(); } },0); }

function addLocation(){
  var id='L'+(nextLocId++); locations[id]={id:id,name:'New Location',order:locOrder.length}; locOrder.push(id);
  pendingDel=null; render(); focusEl('locname-'+id);
}
function setLocName(id,v){ if(locations[id]) locations[id].name=String(v||'').trim(); }
function doDeleteLocation(id){
  pendingDel=null; if(!locations[id]) return;
  teamsOf(id).forEach(function(t){ removeTeam(t.id); });
  delete locations[id]; locOrder=locOrder.filter(function(x){return x!==id;});
  render();
}
function addTeam(locId){
  if(!locations[locId]) return;
  var id='T'+(nextTeamId++); teams[id]={id:id,locId:locId,name:'New Team',order:teamsOf(locId).length};
  collapsedTeam[id]=false;   // a freshly added team opens expanded so you can set it up
  pendingDel=null; render(); focusEl('teamname-'+id);
}
function setTeamName(id,v){ if(teams[id]) teams[id].name=String(v||'').trim(); }

// perpetuated. Blanking the goal clears the date too.
function setTeamGoal(id,v){ if(!teams[id]) return; var t=String(v||'').trim(); teams[id].goal=t; teams[id].goalDate = t ? dateStr() : ''; render(); }
// days between two ISO (yyyy-mm-dd) dates; null if either is unparseable
function daysSinceISO(iso){ if(!iso) return null; var d=new Date(iso+'T00:00:00'); if(isNaN(d.getTime())) return null; return Math.floor((new Date(dateStr()+'T00:00:00')-d)/86400000); }

// ============================== On-time signal (feature 5) ==============================
// Compares the actual weekly pace (from EHA velocity, carried in the feed) with the pace required to
// hit the planned finish. weeksLate = etc*(1/V - 1/R) = (weeks at current pace) - (weeks available);
// both terms are feed-sourced, so past-due handling is inherited from PDVF's requiredVelocity.
function onTimeStatus(w){
  if(!w) return null;
  var etc=parseFloat(w.etc);
  if(!isNaN(etc) && etc<=0) return {cls:'ok',text:'✓ complete',title:'No remaining planned hours'};
  var V=parseFloat(w.avgWeeklyHours), R=parseFloat(w.requiredWeeklyHours);
  if(isNaN(R)||R<=0) return {cls:'na',text:'⏱ no finish-date pace',title:'No required weekly hours (no milestone / no ring total)'};
  if(isNaN(V)||V<=0) return {cls:'na',text:'⏱ '+fmtNum(w.requiredWeeklyHours)+' h/wk needed · no pace data',
    title:'No earned-hour history for this WO, so actual weekly speed is unknown'};
  if(isNaN(etc)) return null;
  var weeksLate = etc*(1/V - 1/R);
  var cls = weeksLate<=1 ? 'ok' : (weeksLate<=2 ? 'warn' : 'bad');
  var lateTxt = weeksLate<=1 ? 'on track' : ('~'+(Math.round(weeksLate*10)/10)+' wk late');
  var text = '⏱ '+fmtNum(w.requiredWeeklyHours)+' h/wk needed · '+fmtNum(w.avgWeeklyHours)+' h/wk pace · '+lateTxt;
  return {cls:cls,text:text,title:'Required '+fmtNum(w.requiredWeeklyHours)+' h/wk vs actual '+fmtNum(w.avgWeeklyHours)+' h/wk; projected '+(Math.round(weeksLate*10)/10)+' weeks vs plan'};
}

// shows, per assigned WO: the header line, tagged technicians, live meta, the SELECTED ops only, a
// "gates remaining" bar, and the required-pace goal line; plus the team's weekly goal at the top.
function parseGatesRemaining(s){
  if(!s) return [];
  return String(s).split('|').map(function(p){ p=p.trim(); if(!p) return null; var i=p.lastIndexOf('=');
    if(i<0) return {name:p,hrs:''}; return {name:p.slice(0,i).trim(), hrs:p.slice(i+1).trim()}; }).filter(Boolean);
}
function artifactOpsFor(woNo, teamId){
  var a=getAssign(woNo,teamId); var sel=a?(a.selectedOps||[]):[];
  var ops=(feedOps[woNo]||[]).filter(function(o){ return sel.indexOf(String(o.operNo))>=0; });
  ops.sort(function(x,y){ var dx=(x.isDr||isDrOp(x.operNo))?0:1, dy=(y.isDr||isDrOp(y.operNo))?0:1;
    if(dx!==dy) return dx-dy; return (parseInt(x.operNo,10)||0)-(parseInt(y.operNo,10)||0); });
  return ops;
}
function teamArtifact(t){
  var loc=locations[t.locId];
  var wolist=assignmentsOfTeam(t.id).map(function(a){
    var w=wos[a.woNo]; if(!w) return null;
    var techs=(a.taggedMembers||[]).map(function(id){ return members[id]?members[id].name:null; }).filter(Boolean);
    return { w:w, ops:artifactOpsFor(a.woNo,t.id), techs:techs, gates:parseGatesRemaining(w.gatesRemaining) };
  }).filter(Boolean);
  return { loc:loc?loc.name:'', team:t.name, goal:t.goal||'', goalDate:t.goalDate||'', goalStale:goalIsStale(t), wos:wolist };
}

// ---- Canvas PNG export: one 1920x1080 PNG per team, auto-paginated (models Gate Tracker signage) ----
var A_W=1920, A_H=1080, A_PAD=40, A_FONT='system-ui,-apple-system,"Segoe UI",sans-serif';
function aRR(ctx,x,y,w,h,r,fill,stroke){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath(); if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();} }
function aTrunc(ctx,t,maxW){ t=String(t==null?'':t); if(ctx.measureText(t).width<=maxW) return t;
  while(t.length && ctx.measureText(t+'…').width>maxW) t=t.slice(0,-1); return t+'…'; }
// Fixed line heights make block height deterministic without a measuring pass.
var BL={title:30,tech:22,meta:26,gap:6,opsHead:30,opRow:27,opsPad:10,noOps:26,grLab:24,grLegend:22,grPad:12,goal:28,blockGap:24};
function blockHeight(b){
  var h=BL.title+BL.tech+BL.meta+BL.gap;
  h += b.ops.length ? (BL.opsHead + b.ops.length*BL.opRow + BL.opsPad) : BL.noOps;
  var segs=b.gates.filter(function(g){ return parseFloat(g.hrs)>0; });
  // label + a gate list estimated at ~4 gates/line (rough; only affects pagination packing).
  h += segs.length ? (BL.grLab+Math.ceil(segs.length/4)*BL.grLegend+BL.grPad) : 0;
  h += BL.goal + BL.blockGap;
  return h;
}
function drawOpsTableCanvas(ctx,ops,x,y,w){
  var wOp=90, wGate=250, wStatus=150, wPlan=130, wName=w-wOp-wGate-wStatus-wPlan;
  var xOp=x, xName=x+wOp, xGate=xName+wName, xStat=xGate+wGate, xPlan=xStat+wStatus;
  aRR(ctx,x,y,w,BL.opsHead,4,'#1e3a5f',null);
  ctx.fillStyle='#fff'; ctx.font='bold 15px '+A_FONT; ctx.textBaseline='middle'; ctx.textAlign='left';
  var hy=y+BL.opsHead/2;
  ctx.fillText('Op #',xOp+8,hy); ctx.fillText('Operation',xName+8,hy); ctx.fillText('Gate',xGate+8,hy);
  ctx.fillText('Status',xStat+8,hy); ctx.fillText('Planned Hours',xPlan+8,hy);
  y+=BL.opsHead;
  ops.forEach(function(o){ var dr=o.isDr||isDrOp(o.operNo);
    if(dr){ ctx.fillStyle='#fef2f2'; ctx.fillRect(x,y,w,BL.opRow); }
    ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(x,y+BL.opRow); ctx.lineTo(x+w,y+BL.opRow); ctx.stroke();
    ctx.font='14px '+A_FONT; ctx.fillStyle='#0f172a'; var my=y+BL.opRow/2; ctx.textBaseline='middle';
    ctx.fillText(aTrunc(ctx,o.operNo+(dr?' (DR)':''),wOp-10),xOp+8,my);
    ctx.fillText(aTrunc(ctx,o.name||'',wName-12),xName+8,my);
    ctx.fillText(aTrunc(ctx,o.gate||'',wGate-12),xGate+8,my);
    ctx.fillText(aTrunc(ctx,o.status||'',wStatus-12),xStat+8,my);
    ctx.fillText(aTrunc(ctx,fmtNum(o.plannedHrs),wPlan-12),xPlan+8,my);
    y+=BL.opRow;
  });
  return y;
}
function drawGatesBarCanvas(ctx,gates,x,y,w){
  var segs=gates.filter(function(g){ return parseFloat(g.hrs)>0; }); if(!segs.length) return y;
  ctx.font='bold 16px '+A_FONT; ctx.fillStyle='#334155'; ctx.textBaseline='top'; ctx.textAlign='left';
  ctx.fillText('Gates Remaining',x,y); y+=BL.grLab;
  // Plain wrapping list of "Name – X h" items (no bar).
  ctx.font='15px '+A_FONT; ctx.fillStyle='#334155';
  var cxl=x, gap=28;
  segs.forEach(function(g){ var item=g.name+' – '+fmtNum(g.hrs)+' h';
    var wItem=ctx.measureText(item).width;
    if(cxl>x && cxl+wItem>x+w){ cxl=x; y+=BL.grLegend; }
    ctx.fillText(item,cxl,y); cxl+=wItem+gap;
  });
  return y+BL.grLegend;
}
function drawBlockCanvas(ctx,b,x,y,w){
  var wo=b.w;
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.font='bold 22px '+A_FONT; ctx.fillStyle='#0f172a'; ctx.fillText(aTrunc(ctx,woTitleLine(wo),w),x,y); y+=BL.title;
  ctx.font='16px '+A_FONT; ctx.fillStyle='#334155';
  ctx.fillText(aTrunc(ctx,'Technicians assigned: '+(b.techs.length?b.techs.join(', '):'—'),w),x,y); y+=BL.tech;
  ctx.fillStyle='#475569'; ctx.fillText(aTrunc(ctx,woMetaLine(wo),w),x,y); y+=BL.meta+BL.gap;
  if(b.ops.length){ y=drawOpsTableCanvas(ctx,b.ops,x,y,w)+BL.opsPad; }
  else { ctx.font='italic 14px '+A_FONT; ctx.fillStyle='#94a3b8'; ctx.fillText('No operations selected for this team.',x,y); y+=BL.noOps; }
  y=drawGatesBarCanvas(ctx,b.gates,x,y,w);
  var segs=b.gates.filter(function(g){ return parseFloat(g.hrs)>0; }); if(segs.length) y+=BL.grPad;
  ctx.font='italic 16px '+A_FONT; ctx.fillStyle='#166534'; ctx.fillText(aTrunc(ctx,woGoalLine(wo),w),x,y); y+=BL.goal;
  return y;
}
function drawTeamCanvas(d, blocks, pageNo, pageCount, scale){
  scale = scale || 1;   // >1 renders at higher DPI for crisp PDF/print output (same logical layout)
  var cv=document.createElement('canvas'); cv.width=A_W*scale; cv.height=A_H*scale;
  var ctx=cv.getContext('2d'); ctx.scale(scale,scale); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,A_W,A_H);
  var x=A_PAD, w=A_W-A_PAD*2, y=A_PAD;

  ctx.font='bold 32px '+A_FONT; ctx.fillStyle='#0f172a';
  var ttl=d.loc+' · '+d.team + (pageCount>1?'  (page '+pageNo+' of '+pageCount+')':'');
  ctx.fillText(aTrunc(ctx,ttl,w),x,y); y+=42;
  var goalTxt='Weekly Goal: '+(d.goal||'— not set —')+(d.goalDate?'  (set '+d.goalDate+(d.goalStale?' · may be stale':'')+')':'');
  aRR(ctx,x,y,w,36,6, d.goalStale?'#fef3c7':'#f1f5f9', d.goalStale?'#fde047':'#e2e8f0');
  ctx.font='bold 18px '+A_FONT; ctx.fillStyle=d.goalStale?'#b45309':'#1e3a5f'; ctx.textBaseline='middle';
  ctx.fillText(aTrunc(ctx,goalTxt,w-20),x+10,y+18); y+=36+16;
  ctx.textBaseline='top';
  // Blocks
  blocks.forEach(function(b){ ctx.strokeStyle='#cbd5e1'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+w,y); ctx.stroke();
    y+=10; y=drawBlockCanvas(ctx,b,x,y,w); y+=BL.blockGap; });
  // Footer bar
  aRR(ctx,0,A_H-30,A_W,30,0,'#fef3c7',null);
  ctx.font='bold 13px '+A_FONT; ctx.fillStyle='#92400e'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('PROPRIETARY — Internal Use Only',A_W/2,A_H-15);
  return cv;
}

// Greedily pack a team's WO blocks into pages of the available canvas height (shared by PNG + PDF).
function teamPages(d){
  var avail=A_H - (A_PAD + 42 + 36 + 16) - 30 - 10;   // header + footer reserved
  var pages=[], cur=[], curH=0;
  d.wos.forEach(function(b){ b._h=blockHeight(b)+10;   // +10 for the separator line
    if(cur.length && curH+b._h>avail){ pages.push(cur); cur=[]; curH=0; }
    cur.push(b); curH+=b._h; });
  if(cur.length||!pages.length) pages.push(cur);
  return pages;
}
function exportTeamPNGs(){
  var list=teamsWithWork();
  if(!list.length){ alert('No teams with assigned work orders yet — assign at least one WO first.'); return; }
  var count=0;
  list.forEach(function(t){
    var d=teamArtifact(t), pages=teamPages(d);
    pages.forEach(function(pg,i){
      var cv=drawTeamCanvas(d,pg,i+1,pages.length,1);
      var suffix=pages.length>1?('-p'+(i+1)):'';
      downloadCanvasPNG(cv,'task-'+safeName(d.loc)+'-'+safeName(d.team)+'-'+dateStr()+suffix+'.png');
      count++;
    });
  });
  showStatus('feed-status','Exported '+count+' team PNG'+(count===1?'':'s')+' ('+list.length+' team'+(list.length===1?'':'s')+').','loaded');
}

// ---- Direct, library-free PDF: one combined tabloid-landscape (17x11) doc, one page per team + spill ----
function b64ToBytes(b64){ var bin=atob(b64), n=bin.length, out=new Uint8Array(n); for(var i=0;i<n;i++) out[i]=bin.charCodeAt(i); return out; }
function strBytes(s){ var n=s.length, out=new Uint8Array(n); for(var i=0;i<n;i++) out[i]=s.charCodeAt(i)&0xff; return out; }
// Assemble a minimal PDF: each page is a JPEG (DCTDecode) image XObject fit to a 17x11in landscape page.
function buildTeamPDF(pageImages){
  var N=pageImages.length, PW=1224, PH=792, M=18;   // 17x11 in at 72pt/in, 0.25in margin
  var chunks=[], offset=0, xref={};
  function push(b){ chunks.push(b); offset+=b.length; }
  function pushStr(s){ push(strBytes(s)); }
  function startObj(n){ xref[n]=offset; }
  pushStr('%PDF-1.3\n%âãÏÓ\n');
  startObj(1); pushStr('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  var kids=[]; for(var i=0;i<N;i++) kids.push((3+i*3)+' 0 R');
  startObj(2); pushStr('2 0 obj\n<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+N+' >>\nendobj\n');
  for(var i=0;i<N;i++){
    var pg=pageImages[i], pageN=3+i*3, contentN=pageN+1, imgN=pageN+2;
    var cW=PW-2*M, cH=PH-2*M, ar=pg.iw/pg.ih, drawW=cW, drawH=cW/ar;
    if(drawH>cH){ drawH=cH; drawW=cH*ar; }
    var tx=(PW-drawW)/2, ty=(PH-drawH)/2;
    var content='q '+drawW.toFixed(2)+' 0 0 '+drawH.toFixed(2)+' '+tx.toFixed(2)+' '+ty.toFixed(2)+' cm /Im0 Do Q\n';
    startObj(pageN); pushStr(pageN+' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /XObject << /Im0 '+imgN+' 0 R >> >> /Contents '+contentN+' 0 R >>\nendobj\n');
    startObj(contentN); pushStr(contentN+' 0 obj\n<< /Length '+content.length+' >>\nstream\n'+content+'endstream\nendobj\n');
    startObj(imgN); pushStr(imgN+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+pg.iw+' /Height '+pg.ih+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+pg.jpg.length+' >>\nstream\n');
    push(pg.jpg); pushStr('\nendstream\nendobj\n');
  }
  var xrefOffset=offset, maxN=2+N*3, lines='xref\n0 '+(maxN+1)+'\n0000000000 65535 f \n';
  for(var n=1;n<=maxN;n++){ lines+=String(xref[n]||0).padStart(10,'0')+' 00000 n \n'; }
  pushStr(lines);
  pushStr('trailer\n<< /Size '+(maxN+1)+' /Root 1 0 R >>\nstartxref\n'+xrefOffset+'\n%%EOF');
  var out=new Uint8Array(offset), p=0; chunks.forEach(function(c){ out.set(c,p); p+=c.length; });
  return out;
}
function exportTeamPDF(){
  var list=teamsWithWork();
  if(!list.length){ alert('No teams with assigned work orders yet — assign at least one WO first.'); return; }
  var SCALE=2, pageImages=[], pageCount=0;
  list.forEach(function(t){
    var d=teamArtifact(t), pages=teamPages(d);
    pages.forEach(function(pg,i){
      var cv=drawTeamCanvas(d,pg,i+1,pages.length,SCALE);
      var b64=cv.toDataURL('image/jpeg',0.92).split(',')[1];
      pageImages.push({jpg:b64ToBytes(b64), iw:cv.width, ih:cv.height});
      pageCount++;
    });
  });
  var bytes=buildTeamPDF(pageImages);
  var blob=new Blob([bytes],{type:'application/pdf'}), url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download='task-team-artifacts-'+dateStr()+'.pdf';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  showStatus('feed-status','Exported PDF — '+pageCount+' page'+(pageCount===1?'':'s')+' across '+list.length+' team'+(list.length===1?'':'s')+' (tabloid 17×11).','loaded');
}

// ============================== Collapse / expand (transient) ==============================
function isLocCollapsed(id){ return collapsedLoc[id]===true; }              // default expanded
function isTeamCollapsed(id){ return collapsedTeam[id]!==false; }           // default collapsed
function toggleLoc(id){ collapsedLoc[id]=!isLocCollapsed(id); render(); }
function toggleTeam(id){ collapsedTeam[id]=isTeamCollapsed(id) ? false : true; render(); }
function expandAll(){ locOrder.forEach(function(l){ collapsedLoc[l]=false; }); Object.keys(teams).forEach(function(t){ collapsedTeam[t]=false; }); render(); }
function collapseAll(){ locOrder.forEach(function(l){ collapsedLoc[l]=true; }); Object.keys(teams).forEach(function(t){ collapsedTeam[t]=true; }); render(); }
// ============================== Render ==============================
function render(){
  var hasPlan = locOrder.length>0 || woOrder.length>0;
  document.getElementById('export-state-btn').disabled = !hasPlan;
  document.getElementById('save-btn').disabled = !hasPlan;
  document.getElementById('snapshot-notice').style.display = isSnapshot ? 'block' : 'none';

  var board=document.getElementById('board');
  var html='<div id="org-pane">';
  if(!locOrder.length){
    html+='<div class="empty-hint">No locations yet. Click <b>+ Add Location</b> to start building your teams.</div>';
  }
  locOrder.forEach(function(locId){
    var loc=locations[locId]; if(!loc) return;
    var tms=teamsOf(locId);
    var locCollapsed=!forceExpand && isLocCollapsed(locId);
    // Distinct WOs assigned anywhere in this location (a WO shared by two teams counts once).
    var locWoSet={}; tms.forEach(function(t){ assignmentsOfTeam(t.id).forEach(function(a){ locWoSet[a.woNo]=1; }); });
    var locWoN=Object.keys(locWoSet).length;

    html+='<div class="loc-head"><span class="caret no-print" onclick="toggleLoc(\''+locId+'\')">'+(locCollapsed?'▸':'▾')+'</span>'+
          '<input class="name-input loc-name" id="locname-'+locId+'" value="'+esc(loc.name)+'" placeholder="Location name" onchange="setLocName(\''+locId+'\',this.value)">'+
          '<span class="count-badge" title="Teams &amp; work orders in this location">'+tms.length+' team'+(tms.length===1?'':'s')+' &middot; '+locWoN+' WO'+(locWoN===1?'':'s')+'</span>'+
          '<span class="spacer"></span>'+
          '<button class="mini no-print" onclick="addTeam(\''+locId+'\')">+ Team</button>'+
          delControl('L'+locId,'doDeleteLocation(\''+locId+'\')')+'</div>';
    if(!locCollapsed){
      if(!tms.length) html+='<div class="empty-hint">No teams yet — add one.</div>';
      tms.forEach(function(t){ html+=teamHTML(t); });
    }
    html+='</div>';
  });
  html+='</div>';

  // pool pane (filter applies here only)
  var poolAll=unassignedWos();
  var pool=poolAll.filter(matchesFilter);
  var countBadge = filterText ? (pool.length+' of '+poolAll.length) : String(poolAll.length);
  html+='<div id="pool-pane"><h2>Unassigned Work Orders <span class="badge pct">'+countBadge+'</span>'+
        (filterText?' <span class="empty-hint">(filtered)</span>':'')+'</h2>';
  html+='<div class="empty-hint no-print" style="margin:-4px 0 4px">Click a work order to assign it to one or more teams.</div>';
  html+='<div id="pool-zone">';
  if(!woOrder.length) html+='<div class="empty-hint">Load a WO Assignment Feed to populate work orders.</div>';
  else if(!poolAll.length) html+='<div class="empty-hint">All work orders are assigned.</div>';
  else if(!pool.length) html+='<div class="empty-hint">No unassigned work orders match &ldquo;'+esc(filterText)+'&rdquo;.</div>';
  pool.forEach(function(w){ html+=woCardHTML(w, null); });
  html+='</div></div>';

  board.innerHTML=html;
}

          ' <span class="x no-print" title="Remove member" onclick="deleteMember(\''+m.id+'\')">&times;</span></span>';
  });
  html+='</div>';

function woCardHTML(w, teamId){
  var cls='wo-card'+(w.stale?' stale':'');
  var html='<div class="'+cls+'">';
  html+='<div class="wo-head clickable" title="Click to assign this work order to teams" onclick="openTeamPicker(\''+esc(w.woNo)+'\')">WO '+esc(w.woNo);
  if(w.stale) html+=' <span class="badge stale" title="No longer in the latest feed">stale</span>';
  if(parseFloat(w.activeDrOps)>0) html+=' <span class="badge dr">DR '+esc(w.activeDrOps)+'</span>';
  var nTeams=teamsOfWo(w.woNo).length;
  if(teamId && nTeams>1) html+=' <span class="badge team" title="This work order is shared across teams">shared &middot; '+nTeams+' teams</span>';
  html+=' <span class="assign-hint no-print">▾ assign</span></div>';
  if(teamId) html+='<div class="wo-remove no-print"><button class="mini danger" onclick="unassignWoFromTeam(\''+esc(w.woNo)+'\',\''+teamId+'\')">Remove from this team</button></div>';
  html+='<div class="wo-sub">'+esc(w.partName||'')+' <span class="pn">'+esc(w.partNo||'')+'</span></div>';

  // Ops follow the global view toggle for ASSIGNED cards; pool cards are decoupled — each unassigned
  // card expands its own ops via "Show operations" so the intake list stays compact.
  var showOps = teamId ? (viewMode==='operation') : !!poolExpanded[w.woNo];
  // Gate summary line — dropped when ops are showing (gates appear per-op in the table).
  if(!showOps) html+='<div class="wo-meta">Gate: '+esc(w.currentGate||'—')+'</div>';
  // Remaining Planned Hours / Planned Finish Date / % retained in BOTH views.
  html+='<div class="wo-meta">Remaining Planned Hours '+fmtNum(w.etc)+' h &middot; Planned Finish Date '+esc(w.plannedFinish||'—')+' &middot; '+
        '<span class="badge pct">'+fmtPct(w.percentComplete)+' complete</span></div>';
  // Provenance: when live data isn't from the current feed, flag it so stale numbers aren't mistaken for live.
  if(w.fromFeed===false){
    html+='<div class="wo-meta"><span class="lastknown" title="These live fields (gate, hours, %, pace, finish) are from a saved plan, not the current MES feed. Upload the latest WO Assignment Feed to refresh.">&#9203; last known'+(w.asOf?' &middot; as of '+esc(w.asOf):'')+' &mdash; upload current feed</span></div>';
  }
  // On-time signal (feature 5): required vs actual weekly pace -> weeks late (green/yellow/red).
  var ot=onTimeStatus(w);
  if(ot) html+='<div class="wo-meta"><span class="ontime '+ot.cls+'" title="'+esc(ot.title)+'">'+ot.text+'</span></div>';
  if(!teamId) html+='<div class="wo-meta no-print"><a class="linkbtn" onclick="togglePoolOps(\''+esc(w.woNo)+'\')">'+(showOps?'Hide operations':'Show operations')+'</a></div>';
  if(showOps) html+=opTableHTML(w, teamId);

  // per-team member tagging (assigned cards only)
  if(teamId && teams[teamId]){
    var a=getAssign(w.woNo,teamId);
    var mem=membersOf(teamId);
    if(mem.length){
      html+='<div class="tagrow"><span class="lab no-print">Members:</span>';
      mem.forEach(function(m){
        var on=a && a.taggedMembers && a.taggedMembers.indexOf(m.id)>=0;
        html+='<span class="mchip'+(on?' tagged':'')+'" onclick="toggleTag(\''+esc(w.woNo)+'\',\''+teamId+'\',\''+m.id+'\')">'+esc(m.name)+'</span>';
      });
      html+='</div>';
    }
  }
  html+='</div>';
  return html;
}

function opTableHTML(w, teamId){
  // Operations come from the feed (feedOps), not the plan — so an imported plan never blanks them.
  if(!(w.woNo in feedOps)) return '<div class="op-none">No operations loaded &mdash; upload the current WO Assignment Feed to see this work order’s operations.</div>';
  var all=(feedOps[w.woNo]||[]).slice();
  if(!all.length) return '<div class="op-none">No operations for this work order.</div>';
  // DR (7000-series) first, then ascending Op # — within each group (active vs pending).
  function sortOps(arr){ return arr.sort(function(a,b){
    var da=(a.isDr||isDrOp(a.operNo))?0:1, db=(b.isDr||isDrOp(b.operNo))?0:1;
    if(da!==db) return da-db; return (parseInt(a.operNo,10)||0)-(parseInt(b.operNo,10)||0); }); }
  // Shown by default = actively workable; pending (future / non-active) ops are revealed on demand.
  var shown=sortOps(all.filter(isActiveOp)), pend=sortOps(all.filter(function(o){ return !isActiveOp(o); }));
  var reveal=!!pendingExpanded[w.woNo];
  var a = teamId ? getAssign(w.woNo, teamId) : null;
  var sel = a ? (a.selectedOps||[]) : [];
  var anySel = a && all.some(function(o){ return sel.indexOf(String(o.operNo))>=0; });   // selected ops (incl. pending) drive the artifact
  var tableCls='op-table'+(teamId && !anySel ? ' print-hide' : '');
  var colspan = teamId ? 6 : 5;
  function rowHTML(o, pending){
    var dr=o.isDr||isDrOp(o.operNo), opNo=String(o.operNo);
    var rowCls=(dr?'dr':'')+(pending?' op-pending':''), cell='', claimNote='';
    if(teamId){
      var claimTeam=claimedByOther(w.woNo, opNo, teamId);
      var on=sel.indexOf(opNo)>=0;
      rowCls += on ? ' op-sel' : ' op-unsel';
      if(claimTeam){
        rowCls += ' op-claimed';
        cell='<td class="sel no-print"><input type="checkbox" disabled></td>';
        claimNote=' <span class="claim-note">('+esc(teamName(claimTeam))+')</span>';
      } else {
        cell='<td class="sel no-print"><input type="checkbox" '+(on?'checked':'')+' onclick="toggleOp(\''+esc(w.woNo)+'\',\''+teamId+'\',\''+esc(opNo)+'\')"></td>';
      }
    }
    return '<tr class="'+rowCls.trim()+'">'+cell+
      '<td class="num">'+esc(opNo)+(dr?' <span class="badge dr">DR</span>':'')+(pending?' <span class="badge pend">pending</span>':'')+'</td>'+
      '<td>'+esc(o.name||'')+claimNote+'</td><td>'+esc(o.gate||'')+'</td><td>'+esc(o.status||'')+'</td>'+
      '<td class="num">'+fmtNum(o.plannedHrs)+'</td></tr>';
  }
  // On assigned cards the leader sees ALL shown ops; the "Include" checkboxes only curate the exported artifact.
  var html = teamId ? '<div class="op-caption no-print">Tick operations to include on the printout / signage &mdash; none ticked = none shown on the artifact.</div>' : '';
  html+='<table class="'+tableCls+'"><thead><tr>'+
    (teamId?'<th class="sel no-print">Include</th>':'')+
    '<th>Op #</th><th>Operation</th><th>Gate</th><th>Status</th><th>Planned hrs</th></tr></thead><tbody>';
  if(!shown.length) html+='<tr class="op-emptyrow"><td colspan="'+colspan+'" class="op-none-cell">No active / in-queue operations.</td></tr>';
  shown.forEach(function(o){ html+=rowHTML(o,false); });
  // Pending / future ops: author must intentionally reveal them to schedule ahead.
  if(pend.length){
    html+='<tr class="pend-toggle no-print"><td colspan="'+colspan+'"><a class="linkbtn" onclick="togglePendingOps(\''+esc(w.woNo)+'\')">'+
      (reveal?'&#8854; Hide pending operations':'&#8853; Expand Pending Operations ('+pend.length+')')+'</a></td></tr>';
    if(reveal) pend.forEach(function(o){ html+=rowHTML(o,true); });
  }
  html+='</tbody></table>';
  return html;
}

// ============================== Feed ingest ==============================
function onFeedFile(input){ if(input.files && input.files[0]) loadCSV(input.files[0], ingestFeed, 'feed-status'); }
function ingestFeed(rows){
  var h=rows[0];
  var iRec=colIndex(h,'Record'), iWO=colIndex(h,'WO');
  if(iRec<0||iWO<0){ showStatus('feed-status','Error: not a WO Assignment Feed (missing Record / WO columns).','error'); return; }
  var iPart=colIndex(h,'Part Number'),iName=colIndex(h,'Part Name'),iProg=colIndex(h,'Program'),
      iGate=colIndex(h,'Current Gate'),iOpsRem=colIndex(h,'Ops Remaining In Gate'),
      iHrsRem=colIndex(h,'Planned Hours Remaining In Gate'),iHrsAll=colIndex(h,'Planned Hours In Gate'),
      iEtc=colIndex(h,'Remaining Planned Hours'),iPct=colIndex(h,'Percent Complete'),
      iFin=colIndex(h,'Planned Finish'),iDr=colIndex(h,'Active DR Ops'),iAsOf=colIndex(h,'As Of'),
      iSerial=colIndex(h,'Serial'),iAvgWk=colIndex(h,'Avg Weekly Hours'),iReqWk=colIndex(h,'Required Weekly Hours'),
      iGatesRem=colIndex(h,'Gates Remaining'),
      iOpNo=colIndex(h,'Operation No'),iOpName=colIndex(h,'Operation Name'),iOpGate=colIndex(h,'Operation Gate'),
      iOpHrs=colIndex(h,'Operation Planned Hours'),iOpSt=colIndex(h,'Operation Status'),iIsDr=colIndex(h,'Is DR');
  var feed={}, feedWos={};
  for(var r=1;r<rows.length;r++){
    var row=rows[r], rec=get(row,iRec).toUpperCase(), wo=get(row,iWO);
    if(!wo) continue;
    if(rec==='OP'){
      if(!feed[wo]){ feed[wo]={woNo:wo,ops:[]}; feedWos[wo]=true; }
      feed[wo].ops.push({ operNo:get(row,iOpNo),name:get(row,iOpName),gate:get(row,iOpGate),
        plannedHrs:get(row,iOpHrs),status:get(row,iOpSt),isDr:/^y/i.test(get(row,iIsDr)) });
    } else { // treat any non-OP row with a WO as the summary row
      feedWos[wo]=true;
      var fin=get(row,iFin), finISO=toISODate(fin);
      feed[wo]=Object.assign(feed[wo]||{ops:[]},{ woNo:wo, partNo:get(row,iPart), partName:get(row,iName),
        program:get(row,iProg), currentGate:get(row,iGate), opsRemInGate:get(row,iOpsRem),
        hrsRemInGate:get(row,iHrsRem), hrsInGate:get(row,iHrsAll), etc:get(row,iEtc),
        percentComplete:get(row,iPct), plannedFinish:(finISO===null?fin:finISO),
        activeDrOps:get(row,iDr), asOf:get(row,iAsOf), serial:get(row,iSerial),
        avgWeeklyHours:get(row,iAvgWk), requiredWeeklyHours:get(row,iReqWk), gatesRemaining:get(row,iGatesRem) });
    }
  }
  var added=0, updated=0, staled=0;
  lastFeed = lastFeed || {};
  Object.keys(feed).forEach(function(wo){
    var f=feed[wo];
    feedOps[wo]=f.ops||[];   // operations always come from the feed; keyed by WO#, plan-independent
    if(!wos[wo]){ var nw={stale:false}; LIVE.forEach(function(k){ if(k in f) nw[k]=f[k]; }); nw.woNo=wo; wos[wo]=nw; woOrder.push(wo); added++; }
    else { var w=wos[wo]; LIVE.forEach(function(k){ if(k in f) w[k]=f[k]; }); w.stale=false; updated++; }
    wos[wo].fromFeed=true;   // live data now comes from the current feed
    // retain the fresh live values so a later plan import can be re-overlaid with them
    var snap={}; LIVE.forEach(function(k){ if(k in wos[wo]) snap[k]=wos[wo][k]; }); lastFeed[wo]=snap;
  });
  // A WO now absent from the latest feed keeps its last-known values but is flagged stale / not-from-feed.
  Object.keys(wos).forEach(function(wo){ if(!feedWos[wo]){ wos[wo].stale=true; wos[wo].fromFeed=false; delete lastFeed[wo]; staled++; } });
  showStatus('feed-status','Loaded '+Object.keys(feed).length+' WOs — '+added+' new, '+updated+' updated'+(staled?', '+staled+' now stale':'')+'.','loaded');
  render();
}

// ============================== Export / Import plan state ==============================
var STATE_HEADER=['Type','Node ID','Parent ID','Order','Name','Badge','WO','Part Number','Part Name',
  'Program','Current Gate','Planned Finish','Remaining Planned Hours','Percent Complete','As Of','Active DR Ops',
  'Team ID','Tagged Member IDs','Selected Ops','Stale',
  'Goal','Goal Date','Serial','Avg Weekly Hours','Required Weekly Hours'];
function exportStateCSV(){
  var lines=[STATE_HEADER.join(',')];
  function pushRow(o){ lines.push(STATE_HEADER.map(function(k){ return csvQuote(o[k]==null?'':o[k]); }).join(',')); }
  locOrder.forEach(function(locId,i){ var l=locations[locId]; if(l) pushRow({Type:'LOC','Node ID':l.id,'Parent ID':'',Order:i,Name:l.name}); });
  locOrder.forEach(function(locId){
    teamsOf(locId).forEach(function(t,ti){
      pushRow({Type:'TEAM','Node ID':t.id,'Parent ID':t.locId,Order:ti,Name:t.name,'Goal':t.goal||'','Goal Date':t.goalDate||''});
      membersOf(t.id).forEach(function(m,mi){ pushRow({Type:'MEMBER','Node ID':m.id,'Parent ID':m.teamId,Order:mi,Name:m.name,Badge:m.badge||''}); });
    });
  });
  woOrder.forEach(function(woNo,i){
    var w=wos[woNo]; if(!w) return;
    pushRow({Type:'WO','Node ID':w.woNo,'Parent ID':'',Order:i,'WO':w.woNo,'Part Number':w.partNo||'',
      'Part Name':w.partName||'','Program':w.program||'','Current Gate':w.currentGate||'',
      'Planned Finish':w.plannedFinish||'','Remaining Planned Hours':w.etc==null?'':w.etc,
      'Percent Complete':w.percentComplete==null?'':w.percentComplete,
      'As Of':w.asOf||'','Active DR Ops':w.activeDrOps==null?'':w.activeDrOps,'Stale':w.stale?'Y':'N',
      'Serial':w.serial||'','Avg Weekly Hours':w.avgWeeklyHours==null?'':w.avgWeeklyHours,
      'Required Weekly Hours':w.requiredWeeklyHours==null?'':w.requiredWeeklyHours});
  });
  // ASSIGN rows (per WO x team): selected ops + tagged members
  locOrder.forEach(function(locId){
    teamsOf(locId).forEach(function(t){
      assignmentsOfTeam(t.id).forEach(function(a){
        pushRow({Type:'ASSIGN','Parent ID':t.id,'WO':a.woNo,'Team ID':t.id,
          'Tagged Member IDs':(a.taggedMembers||[]).join('|'),'Selected Ops':(a.selectedOps||[]).join('|')});
      });
    });
  });
  downloadFile(lines.join('\n'),'task-assignment-plan-'+dateStr()+'.csv','text/csv');
}
function onStateFile(input){ if(input.files && input.files[0]) loadCSV(input.files[0], importState, 'state-status'); }
function maxIdNum(prefix, id){ var m=new RegExp('^'+prefix+'(\\d+)$').exec(id); return m?+m[1]:-1; }
function splitPipe(s){ return s?s.split('|').map(function(x){return x.trim();}).filter(Boolean):[]; }
function importState(rows){
  var h=rows[0];
  var iType=colIndex(h,'Type'), iId=colIndex(h,'Node ID'), iPid=colIndex(h,'Parent ID'),
      iOrder=colIndex(h,'Order'), iName=colIndex(h,'Name'), iBadge=colIndex(h,'Badge'),
      iWO=colIndex(h,'WO'), iPart=colIndex(h,'Part Number'), iPName=colIndex(h,'Part Name'),
      iProg=colIndex(h,'Program'), iGate=colIndex(h,'Current Gate'), iFin=colIndex(h,'Planned Finish'),
      iRPH=colIndex(h,'Remaining Planned Hours'), iEtc=colIndex(h,'ETC'),
      iPct=colIndex(h,'Percent Complete'), iAsOf=colIndex(h,'As Of'), iDr=colIndex(h,'Active DR Ops'),
      iTeam=colIndex(h,'Team ID'), iTags=colIndex(h,'Tagged Member IDs'), iSel=colIndex(h,'Selected Ops'),
      iStale=colIndex(h,'Stale'), iGoal=colIndex(h,'Goal'), iGoalDate=colIndex(h,'Goal Date'),
      iSerial=colIndex(h,'Serial'), iAvgWk=colIndex(h,'Avg Weekly Hours'), iReqWk=colIndex(h,'Required Weekly Hours');
  if(iType<0||iId<0){ showStatus('state-status','Error: not a saved plan (missing Type / Node ID columns).','error'); return; }
  locations={}; locOrder=[]; teams={}; members={}; wos={}; woOrder=[]; assign={};
  collapsedLoc={}; collapsedTeam={}; poolExpanded={}; pendingExpanded={};   // transient view state resets on import (default: locs expanded, teams collapsed)
  nextLocId=0; nextTeamId=0; nextMemberId=0;
  var locRows=[], woOrders={};
  for(var r=1;r<rows.length;r++){
    var row=rows[r], type=get(row,iType).toUpperCase(), id=get(row,iId);
    var order=parseInt(get(row,iOrder),10); if(isNaN(order)) order=r;
    if(type==='LOC'){ locations[id]={id:id,name:get(row,iName),order:order}; locRows.push({id:id,order:order}); nextLocId=Math.max(nextLocId,maxIdNum('L',id)+1); }
    else if(type==='TEAM'){ teams[id]={id:id,locId:get(row,iPid),name:get(row,iName),order:order,
        goal:(iGoal>=0?get(row,iGoal):''), goalDate:(iGoalDate>=0?get(row,iGoalDate):'')}; nextTeamId=Math.max(nextTeamId,maxIdNum('T',id)+1); }
    else if(type==='MEMBER'){ members[id]={id:id,teamId:get(row,iPid),name:get(row,iName),badge:(iBadge>=0?get(row,iBadge):'')||null,order:order}; nextMemberId=Math.max(nextMemberId,maxIdNum('M',id)+1); }
    else if(type==='WO'){
      var wo=get(row,iWO)||id;
      var fin=get(row,iFin), finISO=toISODate(fin);
      var etcv = iRPH>=0 ? get(row,iRPH) : (iEtc>=0?get(row,iEtc):'');
      wos[wo]={ woNo:wo, partNo:get(row,iPart), partName:get(row,iPName), program:get(row,iProg),
        currentGate:get(row,iGate), plannedFinish:(finISO===null?fin:finISO),
        etc:etcv, percentComplete:(iPct>=0?get(row,iPct):''), asOf:get(row,iAsOf),
        activeDrOps:(iDr>=0?get(row,iDr):''), opsRemInGate:'', hrsRemInGate:'', hrsInGate:'',
        serial:(iSerial>=0?get(row,iSerial):''), avgWeeklyHours:(iAvgWk>=0?get(row,iAvgWk):''),
        requiredWeeklyHours:(iReqWk>=0?get(row,iReqWk):''), gatesRemaining:'',
        stale:/^y/i.test(get(row,iStale)) };
      woOrder.push(wo); woOrders[wo]=order;
      // Back-compat: a v1 plan carried Team ID + Tagged Member IDs on the WO row (single team).
      if(iTeam>=0){ var tId=get(row,iTeam); if(tId){ assign[tId+'|'+wo]={teamId:tId,woNo:wo,selectedOps:[],taggedMembers:splitPipe(get(row,iTags))}; } }
    }
    else if(type==='ASSIGN'){
      var awo=get(row,iWO), atid=(iTeam>=0?get(row,iTeam):'')||get(row,iPid);
      if(awo&&atid){ assign[atid+'|'+awo]={teamId:atid,woNo:awo,selectedOps:splitPipe(get(row,iSel)),taggedMembers:splitPipe(get(row,iTags))}; }
    }
  }
  locOrder=locRows.sort(function(a,b){return a.order-b.order;}).map(function(x){return x.id;});
  woOrder.sort(function(a,b){ return (woOrders[a]||0)-(woOrders[b]||0); });
  // Feed-always-wins: the plan's live fields are only last-known. Wherever the most recent feed still
  // has the WO, re-overlay its fresh live values (so import order can't downgrade live data); WOs the
  // feed lacks stay "last known" and are flagged so stale numbers never masquerade as current.
  Object.keys(wos).forEach(function(wo){
    if(lastFeed && lastFeed[wo]){ var f=lastFeed[wo]; LIVE.forEach(function(k){ if(k in f) wos[wo][k]=f[k]; }); wos[wo].stale=false; wos[wo].fromFeed=true; }
    else { wos[wo].fromFeed=false; if(lastFeed) wos[wo].stale=true; }
  });
  // prune dangling assignments + tags
  Object.keys(assign).forEach(function(k){ var a=assign[k];
    if(!teams[a.teamId]||!wos[a.woNo]){ delete assign[k]; return; }
    a.taggedMembers=(a.taggedMembers||[]).filter(function(id){ return members[id] && members[id].teamId===a.teamId; });
  });
  var nAssign=Object.keys(assign).length;
  showStatus('state-status','Imported plan: '+locOrder.length+' locations, '+Object.keys(teams).length+' teams, '+woOrder.length+' work orders, '+nAssign+' assignments.','loaded');
  render();
}

// ============================== Snapshot (editable HTML) ==============================
function snapshotState(){
  return { locations:locations, locOrder:locOrder, teams:teams, members:members, wos:wos, woOrder:woOrder,
    assign:assign, feedOps:feedOps, lastFeed:lastFeed, nextLocId:nextLocId, nextTeamId:nextTeamId, nextMemberId:nextMemberId, viewMode:viewMode };
}
function hydrate(s){
  locations=s.locations||{}; locOrder=s.locOrder||[]; teams=s.teams||{}; members=s.members||{};
  wos=s.wos||{}; woOrder=s.woOrder||[]; assign=s.assign||{}; feedOps=s.feedOps||{}; lastFeed=s.lastFeed||null;
  nextLocId=s.nextLocId||0; nextTeamId=s.nextTeamId||0; nextMemberId=s.nextMemberId||0; viewMode=s.viewMode||'gate';
}
function saveSnapshot(){
  var json=JSON.stringify(snapshotState()).replace(/</g,'\\u003c');
  var inject='<script id="snapshot-data">window.__SNAPSHOT_STATE__ = JSON.parse('+JSON.stringify(json)+');<\/script>\n';
  var docHtml='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  docHtml=docHtml.replace(/<script id="snapshot-data">[\s\S]*?<\/script>\s*/,'');
  docHtml=docHtml.replace('</head>', inject+'</head>');
  downloadFile(docHtml,'task-assignment-plan-'+dateStr()+'.html','text/html');
}

// ============================== Init ==============================
(function init(){
  try{
    if(window.__SNAPSHOT_STATE__){ hydrate(window.__SNAPSHOT_STATE__); isSnapshot=true; }
  }catch(e){}
  var vb=document.getElementById('view-btn'); if(vb) vb.textContent='View: '+(viewMode==='gate'?'Gate names':'Operations');
  render();
})();
</script>
